<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>

<body>

    <h1>Formulir Pendaftaran Seminar</h1>

    <form action="" method="post" enctype="multipart/form-data">

        <!-- TABEL 1 : DATA PESERTA -->

        <h3>Data Peserta</h3>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <!-- Nama Lengkap -->
            <tr>
                <td style="width:32%;">
                    <label for="nama">
                        <strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nama"
                           name="nama" size="25" />
                </td>
            </tr>

            <!-- NIM -->
            <tr>
                <td style="width:32%;">
                    <label for="nim">
                        <strong>NIM</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nim"
                           name="nim" size="25" />
                </td>
            </tr>

            <!-- Jenis Kelamin -->
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki"
                           name="jk" value="Laki-Laki" />
                    <label for="laki">Laki-Laki</label>

                    <input type="radio" id="perempuan"
                           name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>

            <!-- Program Studi -->
            <tr>
                <td style="width:32%;">
                    <label for="prodi">
                        <strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="Informatika">Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknik Industri">Teknik Industri</option>
                    </select>
                </td>
            </tr>

        </table>


        <!-- TABEL 2 : PILIHAN SEMINAR -->

        <h3>Pilihan Seminar</h3>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <!-- Jenis Tiket -->
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler"
                           name="tiket" value="Reguler" />
                    <label for="reguler">Reguler</label>

                    <input type="radio" id="vip"
                           name="tiket" value="VIP" />
                    <label for="vip">VIP</label>
                </td>
            </tr>

            <!-- Topik Seminar -->
            <tr>
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>

                <td>
                    <p>
                        <input type="checkbox" id="web"
                               name="topik" value="Web Development" />
                        <label for="web">Web Development</label>
                    </p>

                    <p>
                        <input type="checkbox" id="data"
                               name="topik" value="Data Science" />
                        <label for="data">Data Science</label>
                    </p>

                    <p>
                        <input type="checkbox" id="ai"
                               name="topik" value="Artificial Intelligence" />
                        <label for="ai">Artificial Intelligence</label>
                    </p>
                </td>
            </tr>

        </table>


        <!-- TABEL 3 : INFORMASI TAMBAHAN -->

        <h3>Informasi Tambahan</h3>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <!-- Alasan Mengikuti Seminar -->
            <tr>
                <td style="width:32%;">
                    <label for="alasan">
                        <strong>Alasan Mengikuti Seminar</strong>
                    </label>
                </td>

                <td>
                    <textarea id="alasan" name="alasan"
                              rows="8" cols="25"></textarea>
                </td>
            </tr>

            <!-- Bukti Pembayaran -->
            <tr>
                <td style="width:32%;">
                    <label for="bukti">
                        <strong>Bukti Pembayaran</strong>
                    </label>
                </td>

                <td>
                    <input type="file" id="bukti"
                           name="bukti" />
                </td>
            </tr>

            <!-- Tombol Simpan -->
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan"
                           value="Simpan" />
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
